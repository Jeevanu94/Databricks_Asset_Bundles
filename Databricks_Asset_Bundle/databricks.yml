# This is a Declarative Automation Bundle definition for Databricks_Asset_Bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Databricks_Asset_Bundle
  uuid: 795cb4ac-362e-4d14-b722-771a8e2cc15a

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8a2ba395-e579.cloud.databricks.com
    variables:
      catalog: dev_declarative_asset_bundles
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-8a2ba395-e579.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/reddynaidu879@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/reddynaidu879@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_declarative_asset_bundles
      schema: rnd
    permissions:
      - user_name: reddynaidu879@gmail.com
        level: CAN_MANAGE
